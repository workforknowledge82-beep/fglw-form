<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FGLW - ऑनलाइन आधिकारिक पंजीकरण प्रपत्र</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }</style>
</head>
<body class="bg-gray-100 min-h-screen py-6 px-4 sm:px-6 lg:px-8">
    <div class="max-w-4xl mx-auto bg-white rounded-xl shadow-lg overflow-hidden border border-gray-200">
        
        <div class="bg-orange-600 text-white text-center p-6 border-b-4 border-emerald-600">
            <h1 class="text-2xl sm:text-3xl font-bold tracking-wide">FGLW</h1>
            <p class="text-xl font-semibold mt-1">फ्यूचर GROWTH लाईफ वेलफेयर संस्था</p>
            <p class="text-sm italic mt-2 text-orange-100">|| सेवा सहयोग समर्पण - हमारा उद्देश्य: आपका विकास, हमारा संकल्प ||</p>
        </div>

        <div id="successMessage" class="hidden m-6 p-6 bg-emerald-50 border-2 border-emerald-500 rounded-xl text-center">
            <span class="text-4xl">🎉</span>
            <h2 class="text-2xl font-bold text-emerald-800 mt-2">बधाई हो, पंजीकरण सफल रहा!</h2>
            <p class="text-emerald-700 mt-1">आपका डेटा सुरक्षित रूप से गूगल शीट में भेज दिया गया है।</p>
        </div>

        <form id="registrationForm" class="p-6 sm:p-8 space-y-6">
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">नाम *</label>
                    <input type="text" name="name" required class="w-full p-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none">
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">पिता का नाम *</label>
                    <input type="text" name="fatherName" required class="w-full p-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none">
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">माता का नाम *</label>
                    <input type="text" name="motherName" required class="w-full p-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none">
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">जेंडर (Gender) *</label>
                    <div class="mt-2.5 space-x-4">
                        <label class="inline-flex items-center"><input type="radio" name="gender" value="पुरुष" required class="text-emerald-600 focus:ring-emerald-500"><span class="ml-2 text-gray-700">पुरुष</span></label>
                        <label class="inline-flex items-center"><input type="radio" name="gender" value="महिला" class="text-emerald-600 focus:ring-emerald-500"><span class="ml-2 text-gray-700">महिला</span></label>
                        <label class="inline-flex items-center"><input type="radio" name="gender" value="अन्य" class="text-emerald-600 focus:ring-emerald-500"><span class="ml-2 text-gray-700">अन्य</span></label>
                    </div>
                </div>
            </div>

            <div class="bg-gray-50 p-4 rounded-lg border border-gray-200">
                <label class="block text-sm font-bold text-gray-700 mb-3">योजना का चयन करें:</label>
                <div class="space-y-2">
                    <label class="flex items-center"><input type="checkbox" name="yojana" value="बाल शिक्षा सहायता योजना" class="rounded text-emerald-600 focus:ring-emerald-500"><span class="ml-2 text-sm text-gray-700">3. बाल शिक्षा सहायता योजना</span></label>
                    <label class="flex items-center"><input type="checkbox" name="yojana" value="गर्भवती महिला सहायता योजना" class="rounded text-emerald-600 focus:ring-emerald-500"><span class="ml-2 text-sm text-gray-700">4. गर्भवती महिला सहायता योजना</span></label>
                    <label class="flex items-center"><input type="checkbox" name="yojana" value="कन्या विवाह सहायता योजना" class="rounded text-emerald-600 focus:ring-emerald-500"><span class="ml-2 text-sm text-gray-700">5. कन्या विवाह सहायता योजना</span></label>
                    <label class="flex items-center"><input type="checkbox" name="yojana" value="किसान कल्याण समृद्धि योजना" class="rounded text-emerald-600 focus:ring-emerald-500"><span class="ml-2 text-sm text-gray-700">6. किसान कल्याण समृद्धि योजना</span></label>
                    <label class="flex items-center"><input type="checkbox" name="yojana" value="अन्य जनकल्याणकारी योजना" class="rounded text-emerald-600 focus:ring-emerald-500"><span class="ml-2 text-sm text-gray-700">7. अन्य जनकल्याणकारी योजना</span></label>
                </div>
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">कार्यकर्ता ID *</label>
                <input type="text" name="workerId" required class="w-full p-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none" value="779139">
            </div>

            <div class="pt-4">
                <button type="submit" id="submitBtn" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-4 rounded-lg shadow transition duration-200">
                    सबमिट करें
                </button>
                <div id="loadingMessage" class="hidden w-full bg-emerald-800 text-white font-semibold py-3 px-4 rounded-lg text-center mt-2 animate-pulse">
                    सफलतापूर्वक सबमिट हो रहा है, कृपया प्रतीक्षा करें...
                </div>
            </div>
        </form>

    </div>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbwhuH60Ll5Gi29Vtf8bq_6nl_wWCMfS17GaMpXqU1wT9XM76kE5t4PUYcbq7N217lZrzA/exec';
        const form = document.getElementById('registrationForm');
        const submitBtn = document.getElementById('submitBtn');
        const loadingMessage = document.getElementById('loadingMessage');
        const successMessage = document.getElementById('successMessage');

        form.addEventListener('submit', e => {
            e.preventDefault();
            
            // बटन छुपाएं और लोडिंग दिखाएं
            submitBtn.classList.add('hidden');
            loadingMessage.classList.remove('hidden');

            fetch(scriptURL, { method: 'POST', body: new FormData(form)})
                .then(response => {
                    loadingMessage.classList.add('hidden');
                    form.classList.add('hidden'); // फॉर्म छुपाएं
                    successMessage.classList.remove('hidden'); // बधाई संदेश दिखाएं
                })
                .catch(error => {
                    submitBtn.classList.remove('hidden');
                    loadingMessage.classList.add('hidden');
                    alert('कुछ गड़बड़ हुई, कृपया दोबारा प्रयास करें।');
                    console.error('Error!', error.message);
                });
        });
    </script>
</body>
</html>
