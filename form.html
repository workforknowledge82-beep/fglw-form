<form id="registrationForm" style="max-width: 400px; margin: 20px auto; padding: 20px; border: 1px solid #ccc; border-radius: 8px;">
  <h2>रजिस्ट्रेशन फॉर्म</h2>
  
  <label>पूरा नाम:</label><br>
  <input type="text" id="name" placeholder="अपना नाम लिखें" required style="width: 100%; padding: 8px; margin: 8px 0;"><br>
  
  <label>मोबाइल नंबर (फोन):</label><br>
  <input type="tel" id="mobile" placeholder="10 अंकों का फोन नंबर" required style="width: 100%; padding: 8px; margin: 8px 0;"><br>
  
  <label>ईमेल आईडी:</label><br>
  <input type="email" id="email" placeholder="अपनी ईमेल लिखें" required style="width: 100%; padding: 8px; margin: 8px 0;"><br>

  <label>कोर्स चुनें:</label><br>
  <select id="course" style="width: 100%; padding: 8px; margin: 8px 0;">
    <option value="Refer and Earn Course">Refer and Earn Course</option>
    <option value="Web Development">Web Development</option>
    <option value="App Development">App Development</option>
  </select><br><br>
  
  <label>अपनी फोटो अपलोड करें:</label><br>
  <input type="file" id="photo" accept="image/*" style="margin: 8px 0;"><br><br>
  
  <label>सिग्नेचर (हस्ताक्षर) अपलोड करें:</label><br>
  <input type="file" id="signature" accept="image/*" style="margin: 8px 0;"><br><br>
  
  <button type="submit" style="width: 100%; padding: 10px; background-color: #4CAF50; color: white; border: none; border-radius: 4px; cursor: pointer;">सबमिट करें</button>
</form>

<script>
document.getElementById('registrationForm').addEventListener('submit', async function(e) {
  e.preventDefault();
  
  // आपका दिया हुआ एकदम सही लाइव लिंक यहाँ सेट कर दिया है
  const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwxvK5WDpsQuv0VUhrleUhj-M5rZzPFznvg6QS-27A9vjbyIxXdqR96FH817NzfxSG25g/exec";

  // फोटो और सिग्नेचर को कोड में बदलने (Base64) का फंक्शन
  const toBase64 = file => new Promise((resolve, reject) => {
    if(!file) resolve("");
    const reader = new FileReader();
    reader.readAsDataURL(file);
    reader.onload = () => resolve(reader.result.split(',')[1]);
    reader.onerror = error => reject(error);
  });

  const photoFile = document.getElementById('photo').files[0];
  const signFile = document.getElementById('signature').files[0];

  const photoData = photoFile ? await toBase64(photoFile) : "";
  const signData = signFile ? await toBase64(signFile) : "";

  // ये हैं वो "Properties" (पैरामीटर्स) जो आपकी शीट में डेटा भेजेंगी
  const formData = new URLSearchParams();
  formData.append('name', document.getElementById('name').value);
  formData.append('mobile', document.getElementById('mobile').value); // फोन नंबर
  formData.append('email', document.getElementById('email').value);
  formData.append('course', document.getElementById('course').value); // कोर्स का नाम
  formData.append('photoData', photoData);
  formData.append('signData', signData);

  // डेटा को आपकी Google Apps Script पर सबमिट करना
  try {
    let response = await fetch(WEB_APP_URL, {
      method: 'POST',
      body: formData,
      headers: {
        'Content-Type': 'application/x-www-form-urlencoded'
      }
    });
    
    let result = await response.json();
    if(result.result === 'success') {
      alert('बधाई हो! फोन नंबर और कोर्स सफलतापूर्वक ऐड हो गया है।');
      document.getElementById('registrationForm').reset(); // फॉर्म खाली करने के लिए
    } else {
      alert('सर्वर एरर: ' + result.error);
    }
  } catch (error) {
    console.error(error);
    alert('नेटवर्क या CORS की समस्या! कृपया चेक करें कि Apps Script में New Deployment सही से हुआ है या नहीं।');
  }
});
</script>
